:root{
  --paper:#f6efdd;
  --surface:#fffaf0;
  --surface2:#f1e5c9;
  --ink:#2b2118;
  --muted:#6f6150;
  --amber:#a35b19;
  --brown:#5d3b20;
  --red:#9e2820;
  --redbg:#f9ddd8;
  --green:#27683b;
  --greenbg:#dcebd8;
  --yellow:#8a6500;
  --yellowbg:#f5df9b;
  --line:#cbbd9d;
  --shadow:0 14px 36px rgba(69,45,18,.12);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#221b14;
    --surface:#2f261c;
    --surface2:#3b2f21;
    --ink:#f2e8d5;
    --muted:#c5b6a0;
    --amber:#e4a35c;
    --brown:#d5a87e;
    --red:#ff867b;
    --redbg:#4a2620;
    --green:#8ccb9b;
    --greenbg:#273d2d;
    --yellow:#efc84f;
    --yellowbg:#4a3a18;
    --line:#5d4f3c;
    --shadow:0 14px 36px rgba(0,0,0,.35);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif
}

button,input{
  font:inherit
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:var(--paper)
}

.warning-banner{
  min-height:58px;
  background:#9e2820;
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px max(18px,calc((100vw - 1180px)/2));
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  line-height:1.35
}

.warning-banner strong{
  letter-spacing:.12em;
  margin-right:8px
}

.warning-banner div{
  flex:1
}

.banner-tag{
  border:1px solid #fff;
  padding:5px 7px;
  white-space:nowrap;
  font-weight:800;
  font-size:11px
}

main{
  max-width:1180px;
  margin:0 auto;
  padding:28px 18px 0
}

.hero{
  display:grid;
  grid-template-columns:1.55fr .85fr;
  gap:28px;
  padding:28px 0 34px;
  border-bottom:3px double var(--brown)
}

.eyebrow{
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.18em;
  font-weight:800;
  color:var(--amber);
  margin:0 0 10px
}

h1{
  font-size:clamp(42px,7vw,72px);
  line-height:.9;
  letter-spacing:-.04em;
  margin:0;
  max-width:700px
}

.lede{
  font-size:20px;
  line-height:1.55;
  color:var(--muted);
  max-width:670px
}

.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.hero-actions a{
  background:var(--brown);
  color:#fff;
  text-decoration:none;
  padding:11px 16px;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:800
}

.hero-actions a.secondary{
  background:transparent;
  color:var(--brown);
  border:1px solid var(--brown)
}

.status-box{
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:20px
}

.status-top{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--amber);
  font:800 11px Arial,sans-serif;
  letter-spacing:.14em
}

.status-box dl{
  margin:18px 0
}

.status-box dl div{
  display:grid;
  grid-template-columns:1fr 1.4fr;
  gap:12px;
  padding:10px 0;
  border-top:1px solid var(--line)
}

dt{
  font:700 12px Arial,sans-serif;
  color:var(--muted)
}

dd{
  margin:0;
  line-height:1.35
}

.status-box>p{
  font-size:14px;
  line-height:1.5;
  color:var(--muted);
  margin:0
}

.red{
  color:var(--red);
  font-weight:700
}

.contents{
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:5;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:4px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:12px 8px;
  margin:0 -8px;
  font-family:Arial,sans-serif;
  font-size:12px
}

.contents span{
  font-weight:800;
  color:var(--amber)
}

.contents a{
  color:var(--ink);
  text-decoration:none
}

.contents a:hover{
  text-decoration:underline
}

.panel{
  padding:38px 0;
  border-bottom:1px solid var(--line)
}

.section-head{
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:20px
}

.section-no{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  background:var(--brown);
  color:#fff;
  font:800 16px Arial,sans-serif
}

.section-head h2{
  font-size:clamp(30px,5vw,44px);
  line-height:1;
  margin:0
}

.section-head>svg,.section-icon svg{
  margin-left:auto;
  color:var(--amber)
}

.how{
  background:var(--surface2);
  padding:26px;
  margin-top:26px
}

.legend{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin:22px 0
}

.legend>div{
  border-top:3px solid var(--brown);
  padding-top:10px
}

.legend p{
  font-size:14px;
  line-height:1.5
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:999px;
  font:800 11px Arial,sans-serif;
  white-space:nowrap
}

.badge-documented,.badge.documented{
  background:var(--greenbg);
  color:var(--green)
}

.badge-reported,.badge.reported{
  background:var(--yellowbg);
  color:var(--yellow)
}

.badge-assumed,.badge.assumed{
  background:#e7d7ed;
  color:#6a366d
}

.badge-unproven,.badge.unproven{
  background:var(--redbg);
  color:var(--red)
}

.callout{
  padding:16px 18px;
  margin:20px 0;
  line-height:1.55
}

.callout p{
  margin:5px 0
}

.callout.amber{
  background:#f7e6c3;
  color:#5f3c0d
}

.callout.red{
  background:var(--redbg);
  color:var(--red);
  border-left:5px solid var(--red)
}

.callout.green{
  background:var(--greenbg);
  color:var(--green);
  border-left:5px solid var(--green)
}

.callout.brown{
  background:var(--surface2)
}

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  background:var(--surface);
  margin:14px 0
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:920px;
  font-family:Arial,sans-serif;
  font-size:13px;
  line-height:1.45
}

th{
  text-align:left;
  background:var(--brown);
  color:#fff;
  padding:11px 10px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.05em
}

td{
  padding:12px 10px;
  border-bottom:1px solid var(--line);
  vertical-align:top
}

tr:last-child td{
  border-bottom:0
}

.person{
  font-weight:800
}

.wording{
  font-family:Georgia,serif;
  font-style:italic
}

.eligible{
  display:inline-block;
  padding:4px 7px;
  font-weight:800
}

.eligible.no{
  background:var(--redbg);
  color:var(--red)
}

.eligible.hold{
  background:var(--red);
  color:#fff
}

.family-intro{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  margin-top:28px
}

.family-intro h3{
  font-size:24px;
  margin:0
}

.family-intro h3 span{
  font-size:16px;
  color:var(--muted);
  font-style:italic
}

.family-intro p{
  color:var(--muted);
  line-height:1.5
}

.count{
  background:var(--amber);
  color:#fff;
  padding:7px 10px;
  font:800 12px Arial,sans-serif;
  white-space:nowrap
}

.record-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border:1px solid var(--line);
  background:var(--surface)
}

.record-strip div{
  padding:15px;
  border-right:1px solid var(--line)
}

.record-strip div:last-child{
  border:0
}

.record-strip span,.record-strip strong{
  display:block
}

.record-strip span{
  font:800 10px Arial,sans-serif;
  color:var(--amber);
  letter-spacing:.12em
}

.record-strip strong{
  font-size:18px;
  margin-top:5px
}

.section-copy{
  font-size:18px;
  line-height:1.6;
  max-width:850px
}

.lead{
  background:var(--surface);
  border-left:4px solid var(--amber);
  padding:16px 18px;
  line-height:1.6
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}

.two-col>div{
  background:var(--surface);
  padding:20px;
  border:1px solid var(--line)
}

.two-col h3{
  margin-top:0
}

.two-col p{
  line-height:1.6
}

.conflict-panel{
  background:#fff1e9!important;
  border-color:#d98b74!important
}

.versus{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:stretch;
  text-align:center;
  border:1px solid var(--line)
}

.versus>div{
  padding:22px
}

.versus span{
  font:800 11px Arial,sans-serif;
  letter-spacing:.14em;
  color:var(--amber)
}

.versus strong{
  display:block;
  font-size:24px;
  margin-top:8px
}

.versus p{
  margin:5px 0
}

.vs{
  align-self:center;
  font-weight:900
}

.hypotheses{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin:18px 0
}

.hypotheses>div{
  padding:16px;
  background:var(--surface);
  border:1px solid var(--line)
}

.hypotheses p{
  margin:5px 0
}

.locked{
  background:#33281c;
  color:#f5ead2;
  padding:20px;
  margin:20px 0
}

.lock-label{
  font:800 11px Arial,sans-serif;
  letter-spacing:.13em;
  color:#f0c16f
}

.locked>div{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:18px
}

.locked span{
  display:block;
  color:#cdbda4;
  font:700 11px Arial,sans-serif
}

.locked strong{
  display:block;
  font-size:19px;
  margin-top:5px
}

.index-panel .section-head{
  margin-bottom:8px
}

.result-count{
  margin-left:auto;
  background:var(--brown);
  color:#fff;
  padding:7px 10px;
  font:800 12px Arial,sans-serif
}

.controls{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  align-items:end;
  margin:20px 0
}

.controls label{
  flex:1;
  min-width:260px
}

.controls label span{
  display:block;
  font:800 12px Arial,sans-serif;
  margin-bottom:6px
}

.controls input{
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink)
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.filters button{
  border:1px solid var(--brown);
  background:transparent;
  color:var(--ink);
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  cursor:pointer
}

.filters button.active{
  background:var(--brown);
  color:#fff
}

.empty{
  padding:24px;
  text-align:center;
  border:1px dashed var(--line)
}

.index-note{
  font-size:13px;
  line-height:1.6;
  color:var(--muted)
}

footer{
  display:flex;
  justify-content:space-between;
  gap:24px;
  padding:30px 0 44px
}

footer p{
  margin:4px 0;
  color:var(--muted);
  line-height:1.5
}

@media(max-width:760px){
  .warning-banner{
    align-items:flex-start
  }

  .banner-tag{
    display:none
  }

  .hero{
    grid-template-columns:1fr
  }

  .hero-actions a{
    flex:1;
    text-align:center
  }

  .contents{
    position:static
  }

  .legend{
    grid-template-columns:1fr 1fr
  }

  .record-strip{
    grid-template-columns:1fr 1fr
  }

  .record-strip div:nth-child(2){
    border-right:0
  }

  .record-strip div{
    border-bottom:1px solid var(--line)
  }

  .family-intro{
    align-items:flex-start
  }

  .count{
    font-size:10px
  }

  .two-col,.hypotheses{
    grid-template-columns:1fr
  }

  .versus{
    grid-template-columns:1fr
  }

  .vs{
    padding:0!important
  }

  .locked>div{
    grid-template-columns:1fr 1fr
  }

  footer{
    flex-direction:column
  }
}

@media(max-width:520px){
  main{
    padding-left:12px;
    padding-right:12px
  }

  .warning-banner{
    padding-left:12px;
    padding-right:12px
  }

  .legend{
    grid-template-columns:1fr
  }

  .record-strip{
    grid-template-columns:1fr
  }

  .record-strip div{
    border-right:0
  }

  .section-head{
    gap:10px
  }

  .section-no{
    width:40px;
    height:40px;
    flex-shrink:0
  }

  .family-intro{
    flex-direction:column
  }

  .count{
    align-self:flex-start
  }

  .locked>div{
    grid-template-columns:1fr
  }
}
