:root{
  --paper:#f7f0dd;
  --surface:#fffaf0;
  --surface-2:#eee0bd;
  --ink:#261d12;
  --muted:#6e6150;
  --amber:#d9a521;
  --amber-dark:#8a5a12;
  --brown:#5f4524;
  --red:#a51f22;
  --red-soft:#fff0ed;
  --green:#1d6b49;
  --green-soft:#e8f3ec;
  --line:#bda979;
  --shadow:0 18px 55px rgba(49,35,10,.13);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#171310;
    --surface:#241d17;
    --surface-2:#312720;
    --ink:#f5ead5;
    --muted:#c5b6a2;
    --amber:#e4b73c;
    --amber-dark:#efc84f;
    --brown:#d7bd8d;
    --red:#ff7772;
    --red-soft:#39201e;
    --green:#77c99f;
    --green-soft:#20362b;
    --line:#5e4e3d;
    --shadow:0 18px 55px rgba(0,0,0,.35);
  }
}

*{
  box-sizing:border-box
}

html{
  background:var(--paper);
  color:var(--ink)
}

body{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  background:var(--paper)
}

button{
  font:inherit
}

.shell{
  min-height:100vh;
  padding:var(--safe-area-inset-top) 0 0;
  background:var(--paper);
  overflow-x:clip
}

.top-banner{
  background:var(--amber);
  color:#211708;
  padding:13px max(18px,calc((100vw - 1120px)/2));
  display:flex;
  flex-wrap:wrap;
  gap:4px 16px;
  align-items:baseline;
  font-size:13px;
  border-bottom:3px solid #231a08
}

.top-banner .eyebrow{
  font-family:Arial,Helvetica,sans-serif;
  font-weight:900;
  letter-spacing:.08em;
  font-size:11px
}

.hero{
  max-width:1120px;
  margin:0 auto;
  padding:42px 24px 22px
}

.kicker{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--amber-dark);
  font-family:Arial,Helvetica,sans-serif;
  font-weight:800;
  letter-spacing:.14em;
  font-size:12px
}

.kicker span{
  background:var(--brown);
  color:var(--paper);
  padding:5px 8px
}

.kicker i{
  height:1px;
  width:45px;
  background:var(--amber)
}

.hero h1{
  font-size:clamp(44px,7vw,84px);
  line-height:.92;
  letter-spacing:-.055em;
  margin:20px 0 14px;
  font-weight:500
}

.hero h1 em{
  font-weight:400;
  color:var(--amber-dark)
}

.deck{
  max-width:850px;
  font-size:19px;
  line-height:1.55;
  color:var(--muted);
  margin:0
}

.hero-meta{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:30px 0 18px
}

.hero-meta div{
  padding:15px 0
}

.hero-meta div+div{
  padding-left:22px;
  border-left:1px solid var(--line)
}

.hero-meta small,.will-side small,.bonds small{
  display:block;
  font-family:Arial,sans-serif;
  font-size:10px;
  letter-spacing:.13em;
  color:var(--muted);
  margin-bottom:4px
}

.hero-meta strong{
  font-size:15px
}

.red{
  color:var(--red)
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.tabs button,.filter-row button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink);
  padding:9px 13px;
  border-radius:999px;
  cursor:pointer;
  font-family:Arial,sans-serif;
  font-size:13px;
  font-weight:700
}

.tabs button.active,.filter-row button.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink)
}

.provenance{
  max-width:1120px;
  margin:12px auto 34px;
  background:var(--red-soft);
  border:2px solid var(--red);
  padding:24px;
  box-shadow:var(--shadow)
}

.prov-head{
  display:flex;
  gap:12px;
  color:var(--red)
}

.prov-head span{
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:900
}

.prov-head h2{
  margin:2px 0 12px;
  font-size:25px
}

.provenance>p{
  font-size:18px;
  line-height:1.5;
  margin:0
}

.prov-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  margin:20px 0;
  border-top:1px solid var(--red);
  padding-top:18px
}

.prov-grid p{
  margin:5px 0 0;
  line-height:1.5;
  color:var(--muted)
}

.prov-end{
  font-weight:800;
  color:var(--red)
}

.section{
  max-width:1120px;
  margin:0 auto;
  padding:24px 24px 38px
}

.section-heading{
  display:flex;
  align-items:end;
  gap:14px;
  margin-bottom:20px
}

.section-heading>span:first-child{
  font-size:38px;
  color:var(--amber-dark);
  line-height:1
}

.section-heading p{
  margin:0 0 3px;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  font-weight:800;
  color:var(--amber-dark)
}

.section-heading h2{
  font-size:clamp(30px,4vw,44px);
  line-height:1;
  margin:0;
  letter-spacing:-.03em
}

.filter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:12px;
  font-family:Arial,sans-serif;
  font-size:13px
}

.filter-row>span{
  font-weight:800
}

.filter-row div{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.filter-row button{
  padding:7px 10px
}

.table-wrap{
  overflow-x:auto;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow)
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px
}

th{
  text-align:left;
  padding:14px 18px;
  background:var(--surface-2);
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.1em
}

td{
  padding:16px 18px;
  border-top:1px solid var(--line);
  line-height:1.4
}

td:first-child{
  width:26%
}

.pill{
  display:inline-flex;
  padding:5px 9px;
  border-radius:99px;
  font-family:Arial,sans-serif;
  font-size:11px;
  font-weight:800
}

.pill.supported{
  background:var(--green-soft);
  color:var(--green)
}

.pill.hold{
  background:var(--red-soft);
  color:var(--red)
}

.pill.neutral{
  background:var(--surface-2);
  color:var(--ink)
}

.table-note{
  color:var(--muted);
  font-style:italic
}

.three{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px
}

.three article{
  background:var(--surface);
  border-top:5px solid var(--amber);
  padding:22px;
  box-shadow:var(--shadow);
  min-height:200px
}

.three article b{
  font-size:38px;
  color:var(--amber-dark)
}

.three h3{
  font-size:25px;
  margin:16px 0 8px
}

.three p,.proof-columns li{
  line-height:1.6;
  color:var(--muted)
}

.proof-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.proof-columns article{
  padding:22px;
  background:var(--surface);
  box-shadow:var(--shadow)
}

.prove{
  border-left:6px solid var(--green)
}

.not-prove{
  border-left:6px solid var(--red)
}

.proof-columns h3{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:22px;
  margin:0 0 12px
}

.prove h3{
  color:var(--green)
}

.not-prove h3{
  color:var(--red)
}

.proof-columns ul{
  margin:0;
  padding-left:20px
}

.questions ol{
  list-style:none;
  padding:0;
  margin:0;
  border-top:1px solid var(--line)
}

.questions li{
  display:grid;
  grid-template-columns:26px 1fr auto;
  gap:14px;
  align-items:center;
  padding:19px 0;
  border-bottom:1px solid var(--line)
}

.questions li svg{
  color:var(--amber-dark)
}

.questions li strong{
  display:block;
  font-size:19px
}

.questions li span{
  color:var(--muted)
}

.questions li>b{
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--red)
}

.all-pending{
  margin-left:auto;
  background:var(--red);
  color:#fff;
  padding:7px 10px;
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  font-weight:900
}

.will-page{
  padding-top:10px
}

.will-intro{
  border-bottom:3px double var(--brown);
  padding-bottom:20px
}

.will-intro span,.will-intro p{
  font-family:Arial,sans-serif;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--amber-dark);
  font-weight:800
}

.will-intro h2{
  font-size:clamp(38px,6vw,62px);
  margin:8px 0
}

.will-layout{
  display:grid;
  grid-template-columns:1.6fr .9fr;
  gap:28px;
  margin-top:26px
}

.line-list>div{
  display:flex;
  gap:16px;
  padding:18px 0;
  border-bottom:1px solid var(--line)
}

.line-list>div>span{
  color:var(--amber-dark);
  font-size:13px
}

.line-list strong{
  font-size:20px
}

.line-list p{
  margin:4px 0 0;
  color:var(--muted);
  line-height:1.5
}

.will-side{
  background:var(--surface);
  padding:22px;
  height:-moz-max-content;
  height:max-content;
  border:1px solid var(--line);
  box-shadow:var(--shadow)
}

.will-side h3{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:21px;
  margin-top:0
}

.will-side p{
  line-height:1.55
}

.will-side>div{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:14px 0;
  margin:18px 0
}

.callout{
  background:var(--surface-2);
  padding:14px;
  margin:0
}

.red-callout{
  background:var(--red-soft);
  color:var(--red)
}

.bonds{
  margin-top:30px;
  background:var(--surface);
  padding:22px;
  display:grid;
  grid-template-columns:.55fr 1.45fr;
  gap:24px;
  border:1px solid var(--line)
}

.bonds h3{
  font-size:27px;
  margin:3px 0
}

.bonds ul{
  list-style:none;
  padding:0;
  margin:0
}

.bonds li{
  display:grid;
  grid-template-columns:1fr 1.4fr;
  gap:18px;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}

.bonds li span{
  color:var(--muted)
}

.compare-cards{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:16px
}

.compare-cards article{
  background:var(--surface);
  padding:22px;
  border:1px solid var(--line);
  box-shadow:var(--shadow)
}

.compare-cards small{
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.13em;
  font-weight:900;
  color:var(--amber-dark)
}

.big{
  display:flex;
  align-items:baseline;
  gap:9px;
  margin:16px 0
}

.big b{
  font-size:62px;
  line-height:1
}

.big span{
  font-family:Arial,sans-serif;
  font-size:13px
}

.equals{
  text-align:center;
  color:var(--amber-dark);
  font-size:24px
}

.match{
  color:var(--green);
  font-weight:700
}

.compare-cards .not-supported{
  border-top:6px solid var(--red)
}

.compare-cards .not-supported h3{
  font-size:28px;
  margin:16px 0 6px
}

.compare-cards .not-supported p{
  color:var(--muted);
  line-height:1.5
}

.method{
  display:flex;
  gap:14px;
  align-items:center;
  background:var(--surface-2);
  padding:18px;
  margin-top:20px
}

.method svg{
  flex:0 0 auto;
  color:var(--brown)
}

.method p{
  margin:0;
  line-height:1.6
}

.local-note{
  display:flex;
  gap:12px;
  align-items:center;
  background:var(--surface);
  border:1px solid var(--line);
  padding:16px;
  margin-top:16px
}

.local-note>div{
  flex:1
}

.local-note p{
  margin:3px 0 0;
  color:var(--muted)
}

.local-note button{
  border:0;
  background:transparent;
  color:var(--amber-dark);
  font-weight:800;
  cursor:pointer;
  text-decoration:underline
}

footer{
  max-width:1120px;
  margin:0 auto;
  padding:30px 24px 50px;
  border-top:2px solid var(--ink)
}

footer>div{
  display:flex;
  gap:12px;
  align-items:center
}

footer>div svg{
  color:var(--amber-dark)
}

footer>div strong{
  display:block
}

footer>div span{
  color:var(--muted)
}

footer>p{
  margin:14px 0 0
}

.file{
  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:.12em;
  color:var(--muted)
}

@media(max-width:700px){
  .hero{
    padding:30px 16px 18px
  }

  .top-banner{
    padding:12px 16px
  }

  .provenance{
    margin:8px 16px 28px;
    padding:20px
  }

  .prov-grid,.proof-columns,.three,.compare-cards{
    grid-template-columns:1fr
  }

  .hero-meta{
    grid-template-columns:1fr
  }

  .hero-meta div+div{
    padding-left:0;
    border-left:0;
    border-top:1px solid var(--line)
  }

  .section{
    padding:22px 16px 30px
  }

  .will-layout,.bonds{
    grid-template-columns:1fr
  }

  .bonds li{
    grid-template-columns:1fr;
    gap:4px
  }

  .questions li{
    grid-template-columns:22px 1fr
  }

  .questions li>b{
    grid-column:2
  }

  .section-heading{
    flex-wrap:wrap
  }

  .all-pending{
    margin:0
  }

  .filter-row{
    align-items:flex-start
  }

  .local-note{
    align-items:flex-start;
    flex-wrap:wrap
  }

  footer{
    padding:28px 16px 44px
  }
}
</style>
